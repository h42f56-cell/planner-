<style>
  :root{
    --bg:#F2F0E6;
    --card:rgba(255,255,255,0.5);
    --glass-border:rgba(255,255,255,0.6);
    --glass-blur:20px;
    --ink:#242621;
    --ink-soft:#5B5D55;
    --ink-faint:#8C8E85;
    --line:#E1DFD2;
    --forest:#2E4A3D;
    --forest-dark:#1E3229;
    --sage:#8FAE94;
    --sage-light:rgba(143,174,148,0.35);
    --ochre:#C08A3E;
    --ochre-light:#F4E6D0;
    --danger:#B5544A;
    --radius:16px;
    --forest-glass:rgba(46,74,61,0.55);
    --chart-primary:#2E4A3D;
    --chart-track:#E1DFD2;
    --chart-bar:#8FAE94;
    --theme-color:#2E4A3D;
    --font-family:'Vazirmatn', sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#141915;
    --card:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.14);
    --ink:#EDEFEA;
    --ink-soft:#B7BDB3;
    --ink-faint:#82887E;
    --line:rgba(255,255,255,0.14);
    --forest:#6FA37E;
    --forest-dark:#9FC7AC;
    --sage:#6C8F72;
    --sage-light:rgba(108,143,114,0.28);
    --ochre:#D9A05B;
    --ochre-light:rgba(217,160,91,0.28);
    --danger:#E28A7E;
    --forest-glass:rgba(111,163,126,0.3);
    --chart-primary:#8FCBA0;
    --chart-track:rgba(255,255,255,0.12);
    --chart-bar:#6C8F72;
    --theme-color:#141915;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(circle at 12% 18%, rgba(46,74,61,0.5), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(192,138,62,0.18), transparent 46%),
      radial-gradient(circle at 25% 92%, rgba(0,0,0,0.5), transparent 48%),
      radial-gradient(circle at 90% 85%, rgba(46,74,61,0.4), transparent 45%),
      linear-gradient(160deg,#12160F,#181D16 55%,#0F1210);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 18%, rgba(143,174,148,0.55), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(192,138,62,0.38), transparent 46%),
      radial-gradient(circle at 25% 92%, rgba(46,74,61,0.35), transparent 48%),
      radial-gradient(circle at 90% 85%, rgba(143,174,148,0.4), transparent 45%),
      linear-gradient(160deg,#EEEBE0,#E2E6DC 55%,#ECE5D3);
    background-attachment:fixed;
    font-family:var(--font-family);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
    transition:background .6s ease, color .3s ease;
  }
  .wrap{max-width:520px; margin:0 auto; padding:20px 16px 60px;}

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .leaf{
    width:38px;height:38px;border-radius:10px;background:var(--forest);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;
  }
  .brand h1{font-size:17px; font-weight:600; margin:0;}
  .brand p{font-size:12px; color:var(--ink-soft); margin:2px 0 0;}

  .datebar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; margin-bottom:16px;
  }
  .datebar button{
    background:rgba(255,255,255,0.35); border:1px solid var(--glass-border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    width:34px; height:34px; border-radius:10px;
    font-size:16px; color:var(--forest-dark); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .datebar button:active{transform:scale(0.94);}
  .datebar .center{text-align:center;}
  .datebar .center .day{font-size:14px; font-weight:600;}
  .datebar .center .rel{font-size:11px; color:var(--ink-faint); margin-top:1px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:16px;
  }
  .card h2{font-size:14px; font-weight:600; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .card h2 .dot{width:6px;height:6px;border-radius:50%; background:var(--forest); flex-shrink:0;}

  .task{
    display:flex; align-items:flex-start; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .task:last-child{border-bottom:none;}
  .check{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--sage);
    flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.3); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:background .15s, border-color .15s;
  }

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const WEEKDAYS = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه','شنبه'];
const WEEKDAYS_SHORT = ['ی','د','س','چ','پ','ج','ش'];
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

// ===== OneSignal scheduled push notifications =====
// یک بار که Cloudflare Worker رو ساختی، آدرسش رو جایگزین خط زیر کن:
const PUSH_WORKER_URL = "https://planner.mahdy3822389.workers.dev/";

function schedulePushForTask(task, dateObj){
  if(!task.time) return; // کاری بدون ساعت، نیازی به نوتیف نداره
  if(PUSH_WORKER_URL.includes('REPLACE-WITH-YOUR-WORKER-URL')) return; // هنوز ورکر ست نشده

  const [hh, mm] = task.time.split(':').map(Number);
  const target = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), hh, mm, 0);
  if(target.getTime() <= Date.now()) return; // زمانش گذشته، نفرست

  // اگه قبلاً دقیقاً برای همین ساعت زمان‌بندی شده بود، دوباره نفرست
  if(task.pushScheduledFor === task.time) return;

  fetch(PUSH_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: 'یادآوری برنامه',
      message: task.text,
      sendAfter: target.toISOString(),
      taskId: task.id
    })
  }).then(()=>{ task.pushScheduledFor = task.time; }).catch(()=>{});
}

function toPersianDigits(input){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(input).replace(/[0-9]/g, ch => map[ch]);
}

const G_DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];
const J_DAYS_IN_MONTH = [31,31,31,31,31,31,30,30,30,30,30,29];

function isGregorianLeap(gy){
  return (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0);
}

function gregorianToJalali(gy, gm, gd){
  const gy2 = gy - 1600;
  const gm2 = gm - 1;
  const gd2 = gd - 1;
  let gDayNo = 365*gy2 + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400);
  for(let i=0;i<gm2;i++) gDayNo += G_DAYS_IN_MONTH[i];
  if(gm2>1 && isGregorianLeap(gy)) gDayNo++;
  gDayNo += gd2;
  let jDayNo = gDayNo - 79;
  const jNp = Math.floor(jDayNo/12053);
  jDayNo %= 12053;
  let jy = 979 + 33*jNp + 4*Math.floor(jDayNo/1461);
  jDayNo %= 1461;
  if(jDayNo >= 366){
    jy += Math.floor((jDayNo-1)/365);
    jDayNo = (jDayNo-1) % 365;
  }
  let i=0;
  for(; i<11 && jDayNo >= J_DAYS_IN_MONTH[i]; i++) jDayNo -= J_DAYS_IN_MONTH[i];
  const jm = i+1;
  const jd = jDayNo+1;
  return { jy, jm, jd };
}

function jalaliToGregorian(jy, jm, jd){
  jy = jy + 1595;
  let days = -355668 + (365*jy) + (Math.floor(jy/33)*8) + (Math.floor(((jy%33)+3)/4)) + jd + (jm<7 ? (jm-1)*31 : ((jm-7)*30)+186);
  let gy = 400*Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){
    gy += 100*Math.floor(--days/36524);
    days %= 36524;
    if(days >= 365) days++;
  }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    gy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let gd = days+1;
  const salA = [0,31,(isGregorianLeap(gy)?29:28),31,30,31,30,31,31,30,31,30,31];
  let gi=1;
  for(; gi<=12 && gd>salA[gi]; gi++) gd -= salA[gi];
  return { gy, gm: gi, gd };
}

function jalaliMonthLength(jy, jm){
  if(jm <= 6) return 31;
  if(jm <= 11) return 30;
  const g = jalaliToGregorian(jy, 12, 30);
  const back = gregorianToJalali(g.gy, g.gm, g.gd);
  return (back.jy===jy && back.jm===12 && back.jd===30) ? 30 : 29;
}

function toKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fromKey(k){
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtDay(d){
  const j = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return WEEKDAYS[d.getDay()] + '، ' + toPersianDigits(j.jd) + ' ' + JALALI_MONTHS[j.jm-1] + ' ' + toPersianDigits(j.jy);
}
function fmtDayShort(d){
  const j = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return toPersianDigits(j.jd) + ' ' + JALALI_MONTHS[j.jm-1];
}
function relLabel(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((dd-today)/86400000);
  if(diff===0) return 'امروز';
  if(diff===1) return 'فردا';
  if(diff===-1) return 'دیروز';
  return diff>0 ? diff+' روز بعد' : Math.abs(diff)+' روز پیش';
}

let currentDate = new Date();
let currentDay = null;
let saveTimer = null;
const dataCache = {};

function emptyDay(){ return { tasks: [], reflection: '', mood: '' }; }

async function ensureLoaded(key){
  if(dataCache[key]) return dataCache[key];
  try{
    const raw = localStorage.getItem(key);
    dataCache[key] = raw ? JSON.parse(raw) : emptyDay();
  }catch(e){
    dataCache[key] = emptyDay();
  }
  return dataCache[key];
}

async function persistKey(key){
  try{
    localStorage.setItem(key, JSON.stringify(dataCache[key]));
    $('#saveNote').textContent = 'ذخیره شد';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ $('#saveNote').textContent=''; }, 1500);
  }catch(e){
    $('#saveNote').textContent = 'خطا در ذخیره‌سازی';
  }
}

async function loadDay(dateObj){
  const key = 'day:' + toKey(dateObj);
  currentDay = await ensureLoaded(key);
  render();
}

function saveDay(){
  return persistKey('day:' + toKey(currentDate));
}

function uid(){ return 't' + Math.random().toString(36).slice(2,9); }

function render(){
  $('#dayLabel').textContent = fmtDay(currentDate);
  $('#relLabel').textContent = relLabel(currentDate);

  const list = $('#taskList');
  list.innerHTML = '';
  if(currentDay.tasks.length === 0){
    list.innerHTML = '<div class="empty">هنوز کاری اضافه نکردی</div>';
  }
  const sorted = [...currentDay.tasks].sort((a,b)=>{
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time && !b.time) return -1;
    if(!a.time && b.time) return 1;
    return 0;
  });
  sorted.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'task';
    row.innerHTML = `
      <div class="check ${t.done?'done':''}" data-id="${t.id}">${t.done?'✓':''}</div>
      <div class="row-top" style="flex:1;">
        ${t.time ? `<span class="time ${t.done?'done':''}">${t.time}</span>` : ''}
        <div class="txt ${t.done?'done':''}" data-id="${t.id}" style="flex:1;">${escapeHtml(t.text)}</div>
      </div>
      <div class="actions">
        <button class="edit" data-id="${t.id}">✎</button>
        <button class="del" data-id="${t.id}">✕</button>
      </div>`;
    list.appendChild(row);
  });

  const done = currentDay.tasks.filter(t=>t.done).length;
  const total = currentDay.tasks.length;
  $('#progFill').style.width = total ? Math.round(done/total*100)+'%' : '0%';
  $('#progNum').textContent = done+'/'+total;

  $('#reflection').value = currentDay.reflection || '';
  document.querySelectorAll('.mood-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.mood === currentDay.mood);
  });

  computeStreakAndWeek();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function computeStreakAndWeek(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(currentDate);
    d.setDate(d.getDate()-i);
    days.push(d);
  }
  const results = [];
  for(const d of days){
    const key = 'day:' + toKey(d);
    const dayData = await ensureLoaded(key);
    const doneCount = dayData.tasks.filter(t=>t.done).length;
    const active = doneCount > 0 || (dayData.reflection && dayData.reflection.trim().length>0);
    results.push({date:d, active, doneCount, total:dayData.tasks.length});
  }

  const week = $('#weekChart');
  week.innerHTML = '';
  const maxCount = Math.max(1, ...results.map(r=>r.total || r.doneCount || 1));
  results.forEach(r=>{
    const isToday = toKey(r.date)===toKey(currentDate);
    const pct = r.total>0 ? Math.max(8, Math.round(r.doneCount/r.total*100)) : (r.active?100:6);
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `
      <div class="bar-bg"><div class="bar-fill ${isToday?'today':''}" style="height:${pct}%"></div></div>
      <div class="lbl">${WEEKDAYS_SHORT[r.date.getDay()]}</div>`;
    week.appendChild(col);
  });

  let streak = 0;
  for(let i=results.length-1;i>=0;i--){
    if(results[i].active) streak++;
    else break;
  }
  $('#streakNum').textContent = streak;
}

$('#addTaskBtn').addEventListener('click', addTask);
$('#newTaskInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') addTask();
});
function addTask(){
  const input = $('#newTaskInput');
  const timeInput = $('#newTaskTime');
  const val = input.value.trim();
  if(!val) return;
  const newTask = {id:uid(), text:val, done:false, time: timeInput.value || ''};
  currentDay.tasks.push(newTask);
  input.value = '';
  timeInput.value = '';
  render();
  saveDay();
  schedulePushForTask(newTask, currentDate);
}

$('#taskList').addEventListener('click', e=>{
  const check = e.target.closest('.check');
  const del = e.target.closest('.del');
  const edit = e.target.closest('.edit');
  if(check){
    const t = currentDay.tasks.find(x=>x.id===check.dataset.id);
    if(t){ t.done = !t.done; render(); saveDay(); }
  } else if(del){
    currentDay.tasks = currentDay.tasks.filter(x=>x.id!==del.dataset.id);
    render(); saveDay();
  } else if(edit){
    const t = currentDay.tasks.find(x=>x.id===edit.dataset.id);
    if(!t) return;
    const txtEl = document.querySelector(`.txt[data-id="${t.id}"]`);
    txtEl.innerHTML = `<div style="display:flex; gap:6px;">
      <input type="time" class="edit-time" value="${t.time||''}" style="width:88px; border:none; background:var(--sage-light); border-radius:8px; padding:6px 4px; font-family:inherit; font-size:13px; color:var(--ink);">
      <input type="text" class="edit-text" value="${escapeHtml(t.text)}" style="flex:1; border:none; background:var(--sage-light); border-radius:8px; padding:6px 8px; font-family:inherit; font-size:14px; color:var(--ink);">
    </div>`;
    const inp = txtEl.querySelector('.edit-text');
    const timeInp = txtEl.querySelector('.edit-time');
    inp.focus();
    inp.select();
    let committed = false;
    const commit = ()=>{
      if(committed) return;
      committed = true;
      const nv = inp.value.trim();
      if(nv) t.text = nv;
      t.time = timeInp.value || '';
      render(); saveDay();
      schedulePushForTask(t, currentDate);
    };
    inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') commit(); });
    timeInp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') commit(); });
    inp.addEventListener('blur', ()=> setTimeout(commit, 150));
    timeInp.addEventListener('blur', ()=> setTimeout(commit, 150));
  }
});

$('#reflection').addEventListener('input', e=>{
  currentDay.reflection = e.target.value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDay, 600);
});

$('#moodRow').addEventListener('click', e=>{
  const btn = e.target.closest('.mood-btn');
  if(!btn) return;
  currentDay.mood = currentDay.mood === btn.dataset.mood ? '' : btn.dataset.mood;
  render();
  saveDay();
});

$('#prevDay').addEventListener('click', ()=>{
  currentDate.setDate(currentDate.getDate()-1);
  loadDay(currentDate);
});
$('#nextDay').addEventListener('click', ()=>{
  currentDate.setDate(currentDate.getDate()+1);
  loadDay(currentDate);
});

function updateNotifButton(){
  const btn = $('#notifBtn');
  const icon = $('#notifIcon');
  const label = $('#notifLabel');
  const hint = $('#notifHint');
  hint.style.display = 'none';
  if(!('Notification' in window)){
    label.textContent = 'یادآوری در این مرورگر پشتیبانی نمی‌شه';
    btn.style.opacity = '0.5';
    return;
  }
  if(Notification.permission === 'granted'){
    icon.textContent = '🔔';
    label.textContent = 'یادآوری فعاله (تا وقتی این صفحه بازه)';
  } else if(Notification.permission === 'denied'){
    icon.textContent = '🔕';
    label.textContent = 'اجازه‌ی یادآوری مسدود شده';
    hint.style.display = 'block';
    hint.textContent = 'چون یک‌بار رد شده، دیگه از داخل صفحه قابل درخواست نیست. باید دستی بازش کنی: روی آیکون قفل/تنظیمات کنار آدرس سایت (یا در منوی مرورگر) بزن → بخش Notifications یا اعلان‌ها رو پیدا کن → روی Allow بذار → صفحه رو رفرش کن.';
  } else {
    icon.textContent = '🔔';
    label.textContent = 'فعال‌سازی یادآوری ساعت کارها';
  }
}

$('#notifBtn').addEventListener('click', async ()=>{
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    try{
      if(window.__oneSignal && window.__oneSignal.Notifications && window.__oneSignal.Notifications.requestPermission){
        await window.__oneSignal.Notifications.requestPermission();
      } else {
        await Notification.requestPermission();
      }
    }catch(e){
      await Notification.requestPermission();
    }
  } else if(Notification.permission === 'granted' && window.__oneSignal){
    // اجازه از قبل هست؛ مطمئن شو OneSignal هم واقعاً مشترک کرده
    try{ await window.__oneSignal.User.PushSubscription.optIn(); }catch(e){}
  }
  updateNotifButton();
});

function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function checkReminders(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const key = 'day:' + toKey(new Date());
  const dayData = await ensureLoaded(key);
  const nowStr = nowHHMM();
  let changed = false;
  dayData.tasks.forEach(t=>{
    if(t.time && !t.done && !t.notified && t.time <= nowStr){
      try{ new Notification('یادآوری برنامه', { body: t.time + ' — ' + t.text, tag:'task-'+t.id }); }catch(e){}
      t.notified = true;
      changed = true;
    }
  });
  if(changed){
    await persistKey(key);
    if(toKey(currentDate) === toKey(new Date())){ currentDay = dayData; render(); }
  }
}

updateNotifButton();
checkReminders();
setInterval(checkReminders, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkReminders(); });

/* ---------- Tabs ---------- */

    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    $('#dayView').style.display = tab==='day' ? '' : 'none';
    $('#weekView').style.display = tab==='week' ? '' : 'none';
    $('#monthView').style.display = tab==='month' ? '' : 'none';
    $('#statsView').style.display = tab==='stats' ? '' : 'none';
    $('#settingsView').style.display = tab==='settings' ? '' : 'none';
    if(tab==='week') renderWeekView();
    if(tab==='month') renderMonthView();
    if(tab==='stats') renderStatsView();
  });
});

/* ---------- Settings (font, theme, background image) ---------- */
const FONT_MAP = {
  vazirmatn: "'Vazirmatn', sans-serif",
  'noto-arabic': "'Noto Sans Arabic', sans-serif",
  'noto-naskh': "'Noto Naskh Arabic', serif",
  lalezar: "'Lalezar', cursive"
};
let settings = { font:'vazirmatn', autoTheme:true, manualTheme:'light', bgImage:null };

async function loadSettings(){
  try{
    const raw = localStorage.getItem('app:settings');
    if(raw) Object.assign(settings, JSON.parse(raw));
  }catch(e){}
}
async function saveSettings(){
  try{ localStorage.setItem('app:settings', JSON.stringify(settings)); }catch(e){}
}

function applyFontUI(){
  document.documentElement.style.setProperty('--font-family', FONT_MAP[settings.font] || FONT_MAP.vazirmatn);
  $$('.font-opt').forEach(b=> b.classList.toggle('active', b.dataset.font === settings.font));
}
function applyManualThemeUI(){
  $('#autoThemeToggle').checked = settings.autoTheme !== false;
  $('#manualThemeRow').style.display = settings.autoTheme === false ? 'flex' : 'none';
  $$('.theme-opt').forEach(b=> b.classList.toggle('active', b.dataset.themeChoice === settings.manualTheme));
}
function applyBgImage(){
  if(settings.bgImage){
    document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.28),rgba(0,0,0,0.28)), url("${settings.bgImage}")`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
    $('#bgStatus').textContent = 'عکس دلخواه فعاله';
  } else {
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundAttachment = '';
    $('#bgStatus').textContent = 'بدون عکس دلخواه — پس‌زمینه‌ی پیش‌فرض فعاله';
  }
}

$$('.font-opt').forEach(b=> b.addEventListener('click', ()=>{
  settings.font = b.dataset.font;
  applyFontUI();
  saveSettings();
}));

$('#autoThemeToggle').addEventListener('change', e=>{
  settings.autoTheme = e.target.checked;
  applyManualThemeUI();
  applyAutoTheme();
  saveSettings();
});
$$('.theme-opt').forEach(b=> b.addEventListener('click', ()=>{
  settings.manualTheme = b.dataset.themeChoice;
  applyManualThemeUI();
  applyAutoTheme();
  saveSettings();
}));

$('#bgUploadBtn').addEventListener('click', ()=> $('#bgImageInput').click());
$('#bgImageInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  $('#bgStatus').textContent = 'در حال پردازش عکس...';
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 1600;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      settings.bgImage = dataUrl;
      applyBgImage();
      saveSettings();
    };
    img.onerror = ()=>{ $('#bgStatus').textContent = 'خطا در پردازش عکس'; };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
$('#bgRemoveBtn').addEventListener('click', ()=>{
  settings.bgImage = null;
  applyBgImage();
  saveSettings();
  $('#bgImageInput').value = '';
});

/* ---------- Stats charts (day / week / month) ---------- */
let chartDay, chartWeek, chartMonth;
function applyAutoTheme(){
  let dark;
  if(settings.autoTheme === false){
    dark = settings.manualTheme === 'dark';
  } else {
    const h = new Date().getHours();
    dark = (h >= 19 || h < 6);
  }
  const html = document.documentElement;
  const wasDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', getComputedStyle(html).getPropertyValue('--theme-color').trim());
  if(window.Chart) Chart.defaults.color = getComputedStyle(html).getPropertyValue('--ink-soft').trim();
  if(dark !== wasDark && $('#statsView').style.display !== 'none') renderStatsView();
}
(async function initSettings(){
  await loadSettings();
  applyFontUI();
  applyManualThemeUI();
  applyBgImage();
  applyAutoTheme();
})();
setInterval(applyAutoTheme, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) applyAutoTheme(); });
if(window.Chart){ Chart.defaults.font.family = "'Vazirmatn', sans-serif"; }
async function renderStatsView(){
  if(!window.Chart){
    ['chartDay','chartWeek','chartMonth'].forEach(id=>{
      const box = $('#'+id).closest('.chart-box');
      box.innerHTML = '<div class="empty" style="padding:0;">نمودار لود نشد — اتصال اینترنت رو چک کن و صفحه رو رفرش کن</div>';
    });
    return;
  }
  const cs = getComputedStyle(document.documentElement);
  const CL = {
    forest: cs.getPropertyValue('--chart-primary').trim(),
    sage: cs.getPropertyValue('--chart-bar').trim(),
    line: cs.getPropertyValue('--chart-track').trim()
  };

  const doneT = currentDay.tasks.filter(t=>t.done).length;
  const totalT = currentDay.tasks.length;
  const pctT = totalT ? Math.round(doneT/totalT*100) : 0;
  if(chartDay) chartDay.destroy();
  chartDay = new Chart($('#chartDay'), {
    type:'doughnut',
    data:{labels:['انجام‌شده','باقی‌مانده'], datasets:[{data:totalT?[doneT, totalT-doneT]:[0,1], backgroundColor:[CL.forest, CL.line], borderWidth:0}]},
    options:{cutout:'72%', maintainAspectRatio:false, plugins:{legend:{display:false}}}
  });
  $('#statDaySummary').textContent = totalT ? `${toPersianDigits(doneT)} از ${toPersianDigits(totalT)} کار (${toPersianDigits(pctT)}٪)` : 'کاری برای امروز ثبت نشده';

  const wDays = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); wDays.push(d); }
  const wKeys = wDays.map(d=>'day:'+toKey(d));
  await Promise.all(wKeys.map(ensureLoaded));
  const wPct = wKeys.map(k=>{ const dd=dataCache[k]; return dd.tasks.length ? Math.round(dd.tasks.filter(t=>t.done).length/dd.tasks.length*100) : 0; });
  if(chartWeek) chartWeek.destroy();
  chartWeek = new Chart($('#chartWeek'), {
    type:'bar',
    data:{labels:wDays.map(d=>WEEKDAYS_SHORT[d.getDay()]), datasets:[{data:wPct, backgroundColor:CL.sage, borderRadius:6}]},
    options:{maintainAspectRatio:false, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'٪'}}}, plugins:{legend:{display:false}}}
  });
  const wAvg = Math.round(wPct.reduce((a,b)=>a+b,0)/wPct.length);
  $('#statWeekSummary').textContent = `میانگین پیشرفت ۷ روز اخیر: ${toPersianDigits(wAvg)}٪`;

  const j0 = gregorianToJalali(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());
  const len = jalaliMonthLength(j0.jy, j0.jm);
  const mDates = []; for(let d=1; d<=len; d++){ const g=jalaliToGregorian(j0.jy,j0.jm,d); mDates.push(new Date(g.gy,g.gm-1,g.gd)); }
  const mKeys = mDates.map(d=>'day:'+toKey(d));
  await Promise.all(mKeys.map(ensureLoaded));
  const mPct = mKeys.map(k=>{ const dd=dataCache[k]; return dd.tasks.length ? Math.round(dd.tasks.filter(t=>t.done).length/dd.tasks.length*100) : null; });
  if(chartMonth) chartMonth.destroy();
  chartMonth = new Chart($('#chartMonth'), {
    type:'line',
    data:{labels:mDates.map((d,i)=>toPersianDigits(i+1)), datasets:[{data:mPct, borderColor:CL.forest, backgroundColor:CL.forest, tension:0.3, spanGaps:true, pointRadius:2}]},
    options:{maintainAspectRatio:false, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'٪'}}}, plugins:{legend:{display:false}}}
  });
  const validDays = mPct.filter(v=>v!==null);
  const mAvg = validDays.length ? Math.round(validDays.reduce((a,b)=>a+b,0)/validDays.length) : 0;
  $('#statMonthSummary').textContent = `میانگین پیشرفت ${JALALI_MONTHS[j0.jm-1]}: ${toPersianDigits(mAvg)}٪ (${toPersianDigits(validDays.length)} روز فعال)`;
}

/* ---------- Shared day-block builder (used in Week view & Month day panel) ---------- */
function buildDayBlock(key, dateObj, opts={}){
  const data = dataCache[key];
  const wrapper = document.createElement('div');
  wrapper.className = 'dayblock' + (key === ('day:'+toKey(new Date())) ? ' today' : '');

  wrapper.innerHTML = `
    <div class="dayblock-head">
      <div><span class="dbh-weekday">${WEEKDAYS[dateObj.getDay()]}</span><span class="dbh-date">${fmtDayShort(dateObj)}</span></div>
      <span class="dbh-count"></span>
    </div>
    <div class="dayblock-tasks"></div>
    <div class="dayblock-add">
      <input type="time" class="db-time">
      <input type="text" class="db-input" placeholder="کار جدید...">
      <button class="db-add">+</button>
    </div>
    ${opts.full ? `
    <div class="dayblock-growth">
      <div class="mood-row db-mood">
        <div class="mood-btn" data-mood="great">😄</div>
        <div class="mood-btn" data-mood="good">🙂</div>
        <div class="mood-btn" data-mood="ok">😐</div>
        <div class="mood-btn" data-mood="low">😞</div>
      </div>
      <textarea class="db-reflection" placeholder="یادداشت رشد امروز...">${escapeHtml(data.reflection||'')}</textarea>
    </div>` : ''}
  `;

  function renderTasks(){
    const list = wrapper.querySelector('.dayblock-tasks');
    list.innerHTML = '';
    const sorted = [...data.tasks].sort((a,b)=>{
      if(a.time && b.time) return a.time.localeCompare(b.time);
      if(a.time && !b.time) return -1;
      if(!a.time && b.time) return 1;
      return 0;
    });
    if(sorted.length===0){ list.innerHTML = '<div class="empty" style="padding:4px 0;">کاری نیست</div>'; }
    sorted.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'task';
      row.innerHTML = `
        <div class="check ${t.done?'done':''}" data-id="${t.id}">${t.done?'✓':''}</div>
        <div class="row-top" style="flex:1;">
          ${t.time ? `<span class="time ${t.done?'done':''}">${t.time}</span>` : ''}
          <div class="txt ${t.done?'done':''}" data-id="${t.id}" style="flex:1;">${escapeHtml(t.text)}</div>
        </div>
        <div class="actions">
          <button class="edit" data-id="${t.id}">✎</button>
          <button class="del" data-id="${t.id}">✕</button>
        </div>`;
      list.appendChild(row);
    });
    const done = data.tasks.filter(t=>t.done).length;
    wrapper.querySelector('.dbh-count').textContent = toPersianDigits(done)+'/'+toPersianDigits(data.tasks.length);
    if(typeof opts.onChange === 'function') opts.onChange();
  }
  renderTasks();

  wrapper.querySelector('.dayblock-tasks').addEventListener('click', e=>{
    const check = e.target.closest('.check');
    const del = e.target.closest('.del');
    const edit = e.target.closest('.edit');
    if(check){
      const t = data.tasks.find(x=>x.id===check.dataset.id);
      if(t){ t.done = !t.done; renderTasks(); persistKey(key); }
    } else if(del){
      data.tasks = data.tasks.filter(x=>x.id!==del.dataset.id);
      renderTasks(); persistKey(key);
    } else if(edit){
      const t = data.tasks.find(x=>x.id===edit.dataset.id);
      if(!t) return;
      const txtEl = wrapper.querySelector(`.txt[data-id="${t.id}"]`);
      txtEl.innerHTML = `<div style="display:flex; gap:6px;">
        <input type="time" class="edit-time" value="${t.time||''}" style="width:82px; border:none; background:var(--sage-light); border-radius:8px; padding:6px 4px; font-family:inherit; font-size:12px; color:var(--ink);">
        <input type="text" class="edit-text" value="${escapeHtml(t.text)}" style="flex:1; border:none; background:var(--sage-light); border-radius:8px; padding:6px 8px; font-family:inherit; font-size:13px; color:var(--ink);">
      </div>`;
      const inp = txtEl.querySelector('.edit-text');
      const timeInp = txtEl.querySelector('.edit-time');
      inp.focus(); inp.select();
      let committed = false;
      const commit = ()=>{
        if(committed) return;
        committed = true;
        const nv = inp.value.trim();
        if(nv) t.text = nv;
        t.time = timeInp.value || '';
        renderTasks(); persistKey(key);
        schedulePushForTask(t, dateObj);
      };
      inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') commit(); });
      timeInp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') commit(); });
      inp.addEventListener('blur', ()=> setTimeout(commit,150));
      timeInp.addEventListener('blur', ()=> setTimeout(commit,150));
    }
  });

  wrapper.querySelector('.db-add').addEventListener('click', ()=>{
    const txtInp = wrapper.querySelector('.db-input');
    const timeInp = wrapper.querySelector('.db-time');
    const v = txtInp.value.trim();
    if(!v) return;
    const newTask = {id:uid(), text:v, done:false, time: timeInp.value||''};
    data.tasks.push(newTask);
    txtInp.value=''; timeInp.value='';
    renderTasks(); persistKey(key);
    schedulePushForTask(newTask, dateObj);
  });
  wrapper.querySelector('.db-input').addEventListener('keydown', e=>{
    if(e.key==='Enter') wrapper.querySelector('.db-add').click();
  });

  if(opts.full){
    const moodRow = wrapper.querySelector('.db-mood');
    moodRow.querySelectorAll('.mood-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.mood === data.mood);
    });
    moodRow.addEventListener('click', e=>{
      const b = e.target.closest('.mood-btn');
      if(!b) return;
      data.mood = data.mood === b.dataset.mood ? '' : b.dataset.mood;
      moodRow.querySelectorAll('.mood-btn').forEach(x=>x.classList.toggle('active', x.dataset.mood===data.mood));
      persistKey(key);
    });
    const refl = wrapper.querySelector('.db-reflection');
    let reflTimer = null;
    refl.addEventListener('input', ()=>{
      data.reflection = refl.value;
      clearTimeout(reflTimer);
      reflTimer = setTimeout(()=>persistKey(key), 600);
    });
  }

  return wrapper;
}

/* ---------- Week View ---------- */
let weekAnchor = new Date();
function weekStart(d){
  const dd = new Date(d);
  const offset = (dd.getDay()+1) % 7; // Saturday = 0
  dd.setDate(dd.getDate()-offset);
  dd.setHours(0,0,0,0);
  return dd;
}
async function renderWeekView(){
  const start = weekStart(weekAnchor);
  const end = new Date(start); end.setDate(end.getDate()+6);
  $('#weekLabel').textContent = fmtDayShort(start) + ' تا ' + fmtDayShort(end);

  const container = $('#weekDays');
  container.innerHTML = '<div class="empty">در حال بارگذاری...</div>';

  const keys = [];
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    keys.push('day:'+toKey(d));
  }
  await Promise.all(keys.map(ensureLoaded));

  container.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const key = 'day:'+toKey(d);
    container.appendChild(buildDayBlock(key, d, {full:false}));
  }
}
$('#prevWeek').addEventListener('click', ()=>{
  weekAnchor.setDate(weekAnchor.getDate()-7);
  renderWeekView();
});
$('#nextWeek').addEventListener('click', ()=>{
  weekAnchor.setDate(weekAnchor.getDate()+7);
  renderWeekView();
});

/* ---------- Month View ---------- */
let monthAnchorJY, monthAnchorJM;
{
  const j0 = gregorianToJalali(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());
  monthAnchorJY = j0.jy; monthAnchorJM = j0.jm;
}
let selectedMonthKey = null;

async function renderMonthView(){
  $('#monthLabel').textContent = JALALI_MONTHS[monthAnchorJM-1] + ' ' + toPersianDigits(monthAnchorJY);

  const head = $('#monthGridHead');
  head.innerHTML = ['ش','ی','د','س','چ','پ','ج'].map(l=>`<span>${l}</span>`).join('');

  const len = jalaliMonthLength(monthAnchorJY, monthAnchorJM);
  const firstG = jalaliToGregorian(monthAnchorJY, monthAnchorJM, 1);
  const firstDate = new Date(firstG.gy, firstG.gm-1, firstG.gd);
  const startCol = (firstDate.getDay()+1) % 7;

  const dayDates = [];
  for(let d=1; d<=len; d++){
    const g = jalaliToGregorian(monthAnchorJY, monthAnchorJM, d);
    dayDates.push(new Date(g.gy, g.gm-1, g.gd));
  }
  const keys = dayDates.map(d=>'day:'+toKey(d));
  await Promise.all(keys.map(ensureLoaded));

  const grid = $('#monthGrid');
  grid.innerHTML = '';
  for(let i=0;i<startCol;i++){
    const c = document.createElement('div');
    c.className = 'month-cell empty-cell';
    grid.appendChild(c);
  }
  const todayKey = 'day:'+toKey(new Date());
  dayDates.forEach((d, idx)=>{
    const key = keys[idx];
    const data = dataCache[key];
    const total = data.tasks.length;
    const done = data.tasks.filter(t=>t.done).length;
    const cell = document.createElement('div');
    cell.className = 'month-cell' + (key===todayKey?' today':'') + (key===selectedMonthKey?' selected':'');
    cell.dataset.key = key;
    cell.innerHTML = `<div class="mc-num">${toPersianDigits(idx+1)}</div>${total>0?`<div class="mc-dot ${done===total?'full':''}"></div>`:''}`;
    cell.addEventListener('click', ()=>{
      selectedMonthKey = key;
      showMonthDayPanel(key, d);
      renderMonthView();
    });
    grid.appendChild(cell);
  });

  if(selectedMonthKey && keys.includes(selectedMonthKey)){
    const idx = keys.indexOf(selectedMonthKey);
    showMonthDayPanel(selectedMonthKey, dayDates[idx]);
  } else {
    $('#monthDayPanel').innerHTML = '<div class="empty">یک روز از تقویم بالا رو انتخاب کن تا برنامه‌اش رو اینجا ببینی و ادیت کنی</div>';
  }
}

function showMonthDayPanel(key, dateObj){
  const panel = $('#monthDayPanel');
  panel.innerHTML = '';
  panel.appendChild(buildDayBlock(key, dateObj, {full:true, onChange: ()=>{
    const cell = document.querySelector(`.month-cell[data-key="${key}"]`);
    if(!cell) return;
    const data = dataCache[key];
    const total = data.tasks.length;
    const done = data.tasks.filter(t=>t.done).length;
    const numHtml = cell.querySelector('.mc-num').outerHTML;
    cell.innerHTML = numHtml + (total>0 ? `<div class="mc-dot ${done===total?'full':''}"></div>` : '');
  }}));
}

$('#prevMonth').addEventListener('click', ()=>{
  monthAnchorJM--;
  if(monthAnchorJM<1){ monthAnchorJM=12; monthAnchorJY--; }
  selectedMonthKey = null;
  renderMonthView();
});
$('#nextMonth').addEventListener('click', ()=>{
  monthAnchorJM++;
  if(monthAnchorJM>12){ monthAnchorJM=1; monthAnchorJY++; }
  selectedMonthKey = null;
  renderMonthView();
});

loadDay(currentDate);
